  .hero::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(to bottom, rgba(30,22,19,.35), transparent 30%), linear-gradient(90deg, rgba(30,22,19,.8) 0%, rgba(30,22,19,.6) 38%, rgba(30,22,19,.2) 70%, rgba(30,22,19,.1) 100%); }
  .hero .txt { padding:0 var(--gutter) calc(var(--hero-edge) * .55); }
  .hero h1 { font-family:var(--font-display); font-weight:300; font-size:min(clamp(3.5rem,2rem + 7vw,8rem),14svh); line-height:.88; }
  .hero p { font-family:var(--font-display); font-size:min(clamp(1.5rem,1.2rem + 1.2vw,2rem),5svh); margin-top:1rem; }

  .middle { position:relative; z-index:1; overflow:hidden; height:var(--middle, 70vh); transition:height 1.6s cubic-bezier(.65,0,.35,1); display:grid; place-items:center; text-align:center; padding:0 1.5rem; }
  .middle .label { font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; opacity:.75; }
  .middle .names { font-family:var(--font-display); font-weight:300; font-size:clamp(2rem,1.5rem + 2vw,3rem); margin:.5rem 0 1.25rem; }
  button { font:inherit; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; color:var(--ivory); background:var(--oxblood); border:0; padding:.85rem 1.25rem; }
  button:focus-visible { outline:2px solid var(--oxblood); outline-offset:3px; }
  body.closed .middle { --middle:0px; }
  .fixed { position:fixed; z-index:10; right:1rem; bottom:calc(1rem + env(safe-area-inset-bottom,0px)); border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.25); }

  .footer { position:relative; z-index:3; isolation:isolate; display:flex; flex-direction:column; justify-content:flex-end;
            margin-top:calc(-1 * var(--hero-edge)); min-height:calc(var(--hero-edge) + clamp(22rem,50svh,34rem));

  const pts = [[0,0],[0.1,0.16],[0.2,0.27],[0.3,0.35],[0.4,0.43],[0.5,0.51],[0.6,0.69],[0.66,0.76],[0.72,0.73],[0.8,0.8],[0.86,0.88],[0.93,0.95],[1,1]];
  const slope = (j) => { const a = pts[Math.max(j-1,0)], b = pts[Math.min(j+1,pts.length-1)]; return (b[1]-a[1])/(b[0]-a[0]); };
  const curve = [];
  for (let s = 0; s <= 72; s++) {
    const x = s / 72; let i = 0; while (i < pts.length - 2 && x > pts[i+1][0]) i++;
    const [x0,y0] = pts[i], [x1,y1] = pts[i+1], dx = x1-x0, t = (x-x0)/dx, t2 = t*t, t3 = t2*t;
    curve.push([x, (2*t3-3*t2+1)*y0 + (t3-2*t2+t)*dx*slope(i) + (-2*t3+3*t2)*y1 + (t3-t2)*dx*slope(i+1)]);
  }
  const bottom = curve.slice().reverse().map(([x,d]) => `${(x*100).toFixed(2)}% calc(100% - ${d.toFixed(4)} * var(--hero-edge))`);
  const top = curve.map(([x,d]) => `${(x*100).toFixed(2)}% calc((1 - ${d.toFixed(4)}) * var(--hero-edge))`);
  document.getElementById("hero").style.clipPath = `polygon(0% 0%, 100% 0%, ${bottom.join(", ")})`;
  document.getElementById("footer").style.clipPath = `polygon(${top.join(", ")}, 100% 100%, 0% 100%)`;

  const btn = document.getElementById("toggle");
  btn.addEventListener("click", () => {
    const closed = document.body.classList.toggle("closed");
    btn.setAttribute("aria-pressed", String(closed));
    btn.textContent = closed ? "Pull it apart again" : "Put the photo back together";
    // scroll so the seam is in the middle of the screen while it closes
    const seam = () => { const r = document.getElementById("footer").getBoundingClientRect(); window.scrollBy({ top: r.top - window.innerHeight * 0.45, behavior: "smooth" }); };
    setTimeout(seam, closed ? 1700 : 50);
  });
})();
</script>
</body>
</html>
